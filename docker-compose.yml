version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: bookverse-db
    restart: always
    environment:
      POSTGRES_USER: nirikshak
      POSTGRES_PASSWORD: nirikshak_dev_pass
      POSTGRES_DB: bookverse
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
